name: verify-oss-scanner-builds
on:
  push:
    branches: [ci-verify]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: crowdsec-blocklist-import
            branch: enroll-crowdsec-blocklist-import
            repo: crowdsec-blocklist-import
          - name: crowdsec-unifi-bouncer
            branch: enroll-crowdsec-unifi-bouncer
            repo: crowdsec-unifi-bouncer
          - name: crowdsec-unifi-parser
            branch: enroll-crowdsec-unifi-parser
            repo: crowdsec-unifi-parser
          - name: linux-mac
            branch: enroll-linux-mac
            repo: linux-mac
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Clone target repo
        run: git clone --depth 1 https://github.com/wolffcatskyy/${{ matrix.repo }} target
      - name: "Docker build (scanner contract - repo checkout as build context)"
        run: docker build -f projects/${{ matrix.name }}/Dockerfile -t scan-${{ matrix.name }} target
      - name: Run tests inside image, networking disabled
        run: |
          case "${{ matrix.name }}" in
            crowdsec-blocklist-import)
              docker run --rm --network none scan-${{ matrix.name }} python -m pytest -q ;;
            crowdsec-unifi-bouncer)
              docker run --rm --network none scan-${{ matrix.name }} bash -c "cd sidecar && go test ./... && shellcheck -S error \$(find . -name '*.sh' -not -path './.git/*')" ;;
            crowdsec-unifi-parser)
              docker run --rm --network none scan-${{ matrix.name }} bash -c "python test_deploy_log_rules.py && python -c \"import glob, yaml; files=[f for f in glob.glob('**/*.yaml', recursive=True)+glob.glob('**/*.yml', recursive=True) if '/.git/' not in f]; [list(yaml.safe_load_all(open(f))) for f in files]; print(len(files), 'YAML files OK')\"" ;;
            linux-mac)
              docker run --rm --network none scan-${{ matrix.name }} bash -c "shellcheck -S error \$(find scripts -name '*.sh') && python3 -c \"import py_compile; py_compile.compile('scripts/audit-modules.py', doraise=True); print('py_compile OK')\"" ;;
          esac
